[project]
name = "fpl-ingest"
version = "0.1.0"
description = "Scheduled raw ingest of the Fantasy Premier League public API into Cloudflare R2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "tenacity",
    "boto3",
    "duckdb",
    "pydantic-settings",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "pyright>=1.1.300",
    "pre-commit>=3.5",
    "boto3-stubs[s3]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Integration tests hit the live FPL API — excluded by default, run manually
# with `pytest -m integration`.
addopts = "-m 'not integration' -rs"
markers = [
    "integration: hits the live FPL API; run manually, never in CI",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
