[project]
name = "fpl-edge"
version = "0.1.0"
description = "Fantasy Premier League companion tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "tenacity",
    "duckdb",
    "polars",
    "streamlit",
    "altair",
    "pydantic-settings",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "pyright>=1.1.300",
    "pre-commit>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
# Integration tests hit the live FPL API — excluded by default, run manually
# with `pytest -m integration`.
addopts = "-m 'not integration' -rs"
markers = [
    "integration: hits the live FPL API; run manually, never in CI",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
