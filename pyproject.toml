[project]
name = "fpl-edge"
version = "0.1.0"
description = "Fantasy Premier League companion tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "tenacity",
    "duckdb",
    "polars",
    "streamlit",
    "altair",
    "pydantic-settings",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
