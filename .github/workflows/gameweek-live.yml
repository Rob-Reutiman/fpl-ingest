name: gameweek-live

# Job 2 — ingest and transform a settled gameweek's match facts. Exits in
# seconds on the run nothing has settled.
#
# Every 4 hours rather than daily: the settlement gate in `fpl.gameweek` only
# does real work once there's a gameweek to check, so a tighter interval costs
# nothing on the runs that find nothing, and it shortens both the normal-case
# lag after `data_checked` flips and the window before a stuck gameweek's
# fixtures get checked. :35 puts it away from hourly-current's :05 slot; all
# three jobs can extend the shared master tables, and Actions cron is only
# approximate, so the schedules are spread rather than merely distinct.

on:
  schedule:
    - cron: "35 1,5,9,13,17,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log the R2 writes instead of performing them
        type: boolean
        default: false

jobs:
  run:
    uses: ./.github/workflows/_ingest.yml
    secrets: inherit
    with:
      job: gameweek_live
      dry_run: ${{ inputs.dry_run || false }}
      timeout_minutes: 20
