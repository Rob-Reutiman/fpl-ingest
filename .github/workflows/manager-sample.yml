name: manager-sample

# Job 3 — harvest ~2,000 managers' picks for a settled gameweek. Cheap no-op
# most runs; ~10 minutes of throttled requests on the run a gameweek settles.
#
# Every 4 hours, offset two hours from gameweek-live so the two never call the
# API in the same window, for the same reason gameweek-live moved off a daily
# schedule: the check itself is nearly free, so a tighter interval only lowers
# the delay between settlement and harvest.

on:
  schedule:
    - cron: "35 3,7,11,15,19,23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log the R2 writes instead of performing them
        type: boolean
        default: false

# A second copy hitting the FPL API alongside the first would double our
# request rate and could duplicate a gameweek's harvest.
concurrency:
  group: manager-sample
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_ingest.yml
    secrets: inherit
    with:
      job: manager_sample
      dry_run: ${{ inputs.dry_run || false }}
      timeout_minutes: 60
