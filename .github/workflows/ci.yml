name: ci

on:
  push:
    branches: [master]
  pull_request:

# The suite is fully mocked, so no R2 credentials are wired in here on purpose.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install

      - run: uv sync --locked --extra dev

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run pyright

      - run: uv run pytest
