repos:
  # Ruff — lint (with autofix) then format. Order matters: lint first.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # General hygiene: trailing whitespace, EOF newline, YAML/TOML validity,
  # accidental large files, merge-conflict markers.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Pyright type check on the source package.
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright src
        language: system
        types: [python]
        pass_filenames: false
